<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美味凉拌菜</title>
    
    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cream: #F5F1E8;
            --warm-white: #FFFEF9;
            --deep-brown: #3E2723;
            --medium-brown: #5D4037;
            --light-brown: #8D6E63;
            --gold: #D4A574;
            --gold-light: #E8C9A0;
            --accent-red: #C62828;
            --shadow: rgba(62, 39, 35, 0.15);
            --shadow-strong: rgba(62, 39, 35, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--warm-white) 100%);
            color: var(--deep-brown);
            min-height: vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, var(--gold-light) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, var(--gold-light) 0%, transparent 50%);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        #root {
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: 3rem 2rem 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--deep-brown);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
            text-shadow: 2px 2px 4px var(--shadow);
        }

        .header p {
            font-size: 1.1rem;
            color: var(--medium-brown);
            font-weight: 300;
            letter-spacing: 0.1em;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem 3rem;
        }

        .image-section {
            background: var(--warm-white);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 24px var(--shadow);
            border: 2px solid var(--gold-light);
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
            position: relative;
            overflow: hidden;
        }

        .image-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--accent-red), var(--gold));
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--deep-brown);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::before {
            content: '🍽️';
            font-size: 1.5rem;
        }

        .upload-area {
            border: 3px dashed var(--gold);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--cream) 0%, var(--warm-white) 100%);
        }

        .upload-area:hover {
            border-color: var(--accent-red);
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--cream) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px var(--shadow);
        }

        .upload-area.dragging {
            border-color: var(--accent-red);
            background: var(--gold-light);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: bounce 2s ease-in-out infinite;
        }

        .upload-text {
            font-size: 1.1rem;
            color: var(--medium-brown);
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            font-size: 0.9rem;
            color: var(--light-brown);
        }

        .image-preview {
            max-width: 100%;
            width: auto;
            height: auto;
            max-height: 600px;
            object-fit: contain;
            object-position: center;
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            animation: fadeIn 0.5s ease-out;
        }

        .image-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 12px;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: 0.05em;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, var(--accent-red) 100%);
            color: white;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-strong);
        }

        .btn-secondary {
            background: var(--cream);
            color: var(--deep-brown);
            border: 2px solid var(--gold);
        }

        .btn-secondary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--accent-red);
            color: white;
        }

        .btn-danger:hover {
            background: #B71C1C;
            transform: translateY(-2px);
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .order-section {
            background: var(--warm-white);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 24px var(--shadow);
            border: 2px solid var(--gold-light);
            animation: fadeInUp 0.8s ease-out 0.4s backwards;
            position: relative;
            overflow: hidden;
        }

        .order-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--accent-red), var(--gold));
        }

        .order-form {
            background: linear-gradient(135deg, var(--cream) 0%, var(--warm-white) 100%);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 2px solid var(--gold-light);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 1rem;
            align-items: end;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--medium-brown);
            letter-spacing: 0.05em;
        }

        .form-input {
            padding: 0.75rem 1rem;
            border: 2px solid var(--gold-light);
            border-radius: 10px;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1rem;
            color: var(--deep-brown);
            background: var(--warm-white);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.2);
        }

        .form-input::placeholder {
            color: var(--light-brown);
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .order-item {
            background: linear-gradient(135deg, var(--cream) 0%, var(--warm-white) 100%);
            border-radius: 14px;
            padding: 1.25rem;
            border: 2px solid var(--gold-light);
            transition: all 0.3s ease;
            animation: fadeInUp 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        .order-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--gold) 0%, var(--accent-red) 100%);
        }

        .order-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 12px var(--shadow);
            border-color: var(--gold);
        }

        .order-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .order-content {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        .order-info {
            flex: 1;
        }

        .order-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--deep-brown);
            margin-bottom: 0.25rem;
        }

        .order-dish {
            font-size: 1rem;
            color: var(--medium-brown);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .order-dish::before {
            content: '→';
            color: var(--gold);
            font-weight: bold;
        }

        .order-actions {
            display: flex;
            gap: 0.5rem;
        }

        .order-empty {
            text-align: center;
            padding: 3rem;
            color: var(--light-brown);
            font-size: 1.1rem;
        }

        .order-empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .edit-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .edit-form {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--medium-brown);
        }

        .spinner {
            border: 3px solid var(--gold-light);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--deep-brown);
            color: var(--warm-white);
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--shadow-strong);
            animation: slideInRight 0.4s ease-out;
            z-index: 1000;
            font-weight: 500;
        }

        .toast.error {
            background: var(--accent-red);
        }

        .toast.success {
            background: #2E7D32;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.5rem; }
            .container { padding: 0 1rem 2rem; }
            .image-section, .order-section { padding: 1.5rem; }
            
            /* Toast 通知移动端适配 */
            .toast {
                left: 1rem;
                right: 1rem;
                top: 1rem;
            }
            
            /* 图片操作按钮组移动端适配 */
            .image-actions {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .image-actions .btn {
                width: 100%;
            }
            
            /* 上传区域移动端适配 */
            .upload-icon {
                font-size: 2.5rem;
            }
            
            .upload-area {
                padding: 1.5rem;
            }
            
            /* Section 标题移动端适配 */
            .section-title {
                font-size: 1.4rem;
            }
            
            /* 按钮移动端适配 - 增加触摸区域 */
            .btn {
                min-height: 44px;
                padding: 0.875rem 1.5rem;
            }
            
            /* 订单操作按钮移动端适配 */
            .order-actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: 0.5rem;
            }
            
            /* 表单按钮移动端适配 */
            .form-row .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Toast Component
        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return <div className={`toast ${type}`}>{message}</div>;
        }

        // Image Upload Component
        function ImageUpload({ dishImage, onUpload, showToast }) {
            const [dragging, setDragging] = useState(false);
            const [uploading, setUploading] = useState(false);
            const fileInputRef = useRef(null);

            const handleDragOver = (e) => {
                e.preventDefault();
                setDragging(true);
            };

            const handleDragLeave = () => setDragging(false);

            const handleDrop = (e) => {
                e.preventDefault();
                setDragging(false);
                const file = e.dataTransfer.files[0];
                if (file) handleFileUpload(file);
            };

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) handleFileUpload(file);
            };

            const handleFileUpload = async (file) => {
                if (!file.type.startsWith('image/')) {
                    showToast('请上传图片文件', 'error');
                    return;
                }

                setUploading(true);
                const formData = new FormData();
                formData.append('image', file);

                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    if (data.success) {
                        onUpload(data.image);
                        showToast('图片上传成功！', 'success');
                    } else {
                        showToast(data.error || '上传失败', 'error');
                    }
                } catch (error) {
                    showToast('上传失败，请重试', 'error');
                } finally {
                    setUploading(false);
                }
            };

            return (
                <div className="image-section">
                    <h2 className="section-title">今日菜品</h2>
                    
                    {uploading ? (
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>上传中...</p>
                        </div>
                    ) : dishImage ? (
                        <div>
                            <img src={dishImage} alt="菜品图片" className="image-preview" />
                            <div className="image-actions">
                                <button className="btn btn-secondary" onClick={() => fileInputRef.current.click()}>
                                    🔄 更换图片
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div
                            className={`upload-area ${dragging ? 'dragging' : ''}`}
                            onDragOver={handleDragOver}
                            onDragLeave={handleDragLeave}
                            onDrop={handleDrop}
                            onClick={() => fileInputRef.current.click()}
                        >
                            <div className="upload-icon">📸</div>
                            <div className="upload-text">点击或拖拽上传菜品图片</div>
                            <div className="upload-hint">支持 JPG、PNG、GIF、WEBP 格式</div>
                        </div>
                    )}
                    <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*"
                        onChange={handleFileSelect}
                        style={{ display: 'none' }}
                    />
                </div>
            );
        }

        // Order Item Component
        function OrderItem({ order, onEdit, onDelete, showToast }) {
            const [editing, setEditing] = useState(false);
            const [editName, setEditName] = useState(order.name);
            const [editDish, setEditDish] = useState(order.dish);

            const handleSave = async () => {
                if (!editName.trim() || !editDish.trim()) {
                    showToast('姓名和菜品名称不能为空', 'error');
                    return;
                }

                try {
                    const response = await fetch(`/api/orders/${order.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: editName, dish: editDish })
                    });
                    const data = await response.json();

                    if (data.success) {
                        onEdit(data.order);
                        setEditing(false);
                        showToast('修改成功！', 'success');
                    } else {
                        showToast(data.error || '修改失败', 'error');
                    }
                } catch (error) {
                    showToast('修改失败，请重试', 'error');
                }
            };

            const handleDelete = async () => {
                if (!confirm('确定要删除这条记录吗？')) return;

                try {
                    const response = await fetch(`/api/orders/${order.id}`, { method: 'DELETE' });
                    const data = await response.json();

                    if (data.success) {
                        onDelete(order.id);
                        showToast('删除成功！', 'success');
                    } else {
                        showToast(data.error || '删除失败', 'error');
                    }
                } catch (error) {
                    showToast('删除失败，请重试', 'error');
                }
            };

            if (editing) {
                return (
                    <div className="order-item">
                        <div className="edit-form">
                            <div className="form-group">
                                <label className="form-label">姓名</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={editName}
                                    onChange={(e) => setEditName(e.target.value)}
                                    placeholder="请输入姓名"
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">菜品名称</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={editDish}
                                    onChange={(e) => setEditDish(e.target.value)}
                                    placeholder="请输入菜品名称"
                                />
                            </div>
                        </div>
                        <div className="order-actions">
                            <button className="btn btn-primary btn-small" onClick={handleSave}>
                                ✓ 保存
                            </button>
                            <button className="btn btn-secondary btn-small" onClick={() => setEditing(false)}>
                                ✕ 取消
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="order-item">
                    <div className="order-content">
                        <div className="order-info">
                            <div className="order-name">{order.name}</div>
                            <div className="order-dish">{order.dish}</div>
                        </div>
                        <div className="order-actions">
                            <button className="btn btn-secondary btn-small" onClick={() => setEditing(true)}>
                                ✏️ 编辑
                            </button>
                            <button className="btn btn-danger btn-small" onClick={handleDelete}>
                                🗑️ 删除
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Order List Component
        function OrderList({ orders, onRefresh, showToast }) {
            const [name, setName] = useState('');
            const [dish, setDish] = useState('');
            const [submitting, setSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (!name.trim() || !dish.trim()) {
                    showToast('姓名和菜品名称不能为空', 'error');
                    return;
                }

                setSubmitting(true);

                try {
                    const response = await fetch('/api/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, dish })
                    });
                    const data = await response.json();

                    if (data.success) {
                        onRefresh();
                        setName('');
                        setDish('');
                        showToast('添加成功！', 'success');
                    } else {
                        showToast(data.error || '添加失败', 'error');
                    }
                } catch (error) {
                    showToast('添加失败，请重试', 'error');
                } finally {
                    setSubmitting(false);
                }
            };

            const handleEdit = (updatedOrder) => {
                onRefresh();
            };

            const handleDelete = (orderId) => {
                onRefresh();
            };

            return (
                <div className="order-section">
                    <h2 className="section-title">点菜清单</h2>
                    
                    <form className="order-form" onSubmit={handleSubmit}>
                        <div className="form-row">
                            <div className="form-group">
                                <label className="form-label">姓名</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    placeholder="请输入姓名"
                                    disabled={submitting}
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">菜品名称</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={dish}
                                    onChange={(e) => setDish(e.target.value)}
                                    placeholder="请输入想吃的菜"
                                    disabled={submitting}
                                />
                            </div>
                            <button type="submit" className="btn btn-primary" disabled={submitting}>
                                {submitting ? '添加中...' : '➕ 添加'}
                            </button>
                        </div>
                    </form>

                    <div className="order-list">
                        {orders.length === 0 ? (
                            <div className="order-empty">
                                <div className="order-empty-icon">📝</div>
                                <p>还没有人点菜，快来添加吧！</p>
                            </div>
                        ) : (
                            orders.map((order) => (
                                <OrderItem
                                    key={order.id}
                                    order={order}
                                    onEdit={handleEdit}
                                    onDelete={handleDelete}
                                    showToast={showToast}
                                />
                            ))
                        )}
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [dishImage, setDishImage] = useState(null);
            const [orders, setOrders] = useState([]);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
            };

            const fetchData = async () => {
                try {
                    const response = await fetch('/api/orders');
                    const data = await response.json();
                    setDishImage(data.dishImage);
                    setOrders(data.orders || []);
                } catch (error) {
                    showToast('加载数据失败', 'error');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            if (loading) {
                return (
                    <div className="loading" style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <div>
                            <div className="spinner"></div>
                            <p>加载中...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    <header className="header">
                        <h1>美味凉拌菜</h1>
                        <p>Delicious Order System</p>
                    </header>

                    <div className="container">
                        <ImageUpload
                            dishImage={dishImage}
                            onUpload={setDishImage}
                            showToast={showToast}
                        />

                        <OrderList
                            orders={orders}
                            onRefresh={fetchData}
                            showToast={showToast}
                        />
                    </div>

                    {toast && (
                        <Toast
                            message={toast.message}
                            type={toast.type}
                            onClose={() => setToast(null)}
                        />
                    )}
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
